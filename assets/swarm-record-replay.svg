<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
<title id="title">Capture, replay, export</title><desc id="desc">Observed Ruflo snapshots can be recorded and replayed or exported as video.</desc>
<rect width="1000" height="250" rx="22" fill="#0b1115"/><rect x="1" y="1" width="998" height="248" rx="21" fill="none" stroke="#283b3c"/>
<text x="35" y="45" fill="#d5fb8d" font-family="Arial,sans-serif" font-size="14" font-weight="bold" letter-spacing="2">OBSERVE · REPLAY · EXPORT</text><text x="35" y="77" fill="#eef7ef" font-family="Arial,sans-serif" font-size="22" font-weight="bold">Turn observed activity into a story.</text>
<g fill="#16241f" stroke="#345146"><rect x="35" y="108" width="275" height="94" rx="11"/><rect x="362" y="108" width="275" height="94" rx="11"/><rect x="689" y="108" width="276" height="94" rx="11"/></g>
<g font-family="Arial,sans-serif"><text x="57" y="144" fill="#d5fb8d" font-size="17" font-weight="bold">01  Observe</text><text x="57" y="171" fill="#a9bcb3" font-size="13">Capture local snapshot changes</text><text x="384" y="144" fill="#7dc9fc" font-size="17" font-weight="bold">02  Replay</text><text x="384" y="171" fill="#a9bcb3" font-size="13">Review source and timing</text><text x="711" y="144" fill="#c9acff" font-size="17" font-weight="bold">03  Export</text><text x="711" y="171" fill="#a9bcb3" font-size="13">Save JSON or a portrait MP4</text></g>
<g stroke="#64826e" stroke-width="2" fill="none"><path d="M315 155h42"/><path d="M642 155h42"/></g><circle r="5" fill="#c9f678"><animateMotion path="M315 155 H357" dur="1.6s" repeatCount="indefinite"/></circle><circle r="5" fill="#7dc9fc"><animateMotion path="M642 155 H684" dur="1.6s" begin=".8s" repeatCount="indefinite"/></circle>
</svg>
