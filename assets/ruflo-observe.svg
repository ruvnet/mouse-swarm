<g font-family="Arial,sans-serif"><text x="59" y="136" fill="#d5fb8d" font-size="17" font-weight="bold">Ruflo CLI</text><text x="59" y="160" fill="#a9bcb3" font-size="13">Agent registrations</text><text x="404" y="136" fill="#d5fb8d" font-size="17" font-weight="bold">Local bridge</text><text x="404" y="160" fill="#a9bcb3" font-size="13">Minimal status fields</text><text x="749" y="136" fill="#d5fb8d" font-size="17" font-weight="bold">Browser view</text><text x="749" y="160" fill="#a9bcb3" font-size="13">Source and freshness</text></g>
