<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 205" role="img" aria-labelledby="title desc"><title id="title">Reveal controls</title><desc id="desc">Replay, pause, resume, and skip controls with an animated progress bar.</desc><rect width="1000" height="205" rx="22" fill="#0b1115"/><rect x="1" y="1" width="998" height="203" rx="21" fill="none" stroke="#283b3c"/>
<text x="34" y="43" fill="#c9acff" font-family="Arial,sans-serif" font-size="14" font-weight="bold" letter-spacing="2">MAKE IT YOURS</text><text x="34" y="76" fill="#eef7ef" font-family="Arial,sans-serif" font-size="22" font-weight="bold">Tune the motion. Keep people in control.</text>
<g fill="#16241f" stroke="#345146"><rect x="35" y="98" width="200" height="45" rx="9"/><rect x="249" y="98" width="200" height="45" rx="9"/><rect x="463" y="98" width="200" height="45" rx="9"/><rect x="677" y="98" width="288" height="45" rx="9"/></g>
<g fill="#d5fb8d" font-family="Arial,sans-serif" font-size="15" font-weight="bold"><text x="65" y="126">Replay</text><text x="279" y="126">Pause</text><text x="493" y="126">Resume</text><text x="707" y="126">Skip animation</text></g><rect x="35" y="163" width="930" height="6" rx="3" fill="#263b30"/><rect x="35" y="163" width="930" height="6" rx="3" fill="#c9f678"><animate attributeName="width" values="0;930;930;0" keyTimes="0;.72;.9;1" dur="6s" repeatCount="indefinite"/></rect></svg>
