<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 235" role="img" aria-labelledby="title desc">
<title id="title">MetaHarness session integration</title><desc id="desc">An explicitly mapped local session feeds a minimized timeline.</desc><rect width="1000" height="235" rx="22" fill="#0b1115"/><rect x="1" y="1" width="998" height="233" rx="21" fill="none" stroke="#283b3c"/>
<text x="35" y="44" fill="#c9acff" font-family="Arial,sans-serif" font-size="14" font-weight="bold" letter-spacing="2">METAHARNESS + MOUSE SWARM</text><text x="35" y="76" fill="#eef7ef" font-family="Arial,sans-serif" font-size="22" font-weight="bold">Bring your own session. Keep its provenance.</text>
<g fill="#16241f" stroke="#345146"><rect x="35" y="106" width="275" height="88" rx="11"/><rect x="362" y="106" width="275" height="88" rx="11"/><rect x="689" y="106" width="276" height="88" rx="11"/></g>
<g font-family="Arial,sans-serif"><text x="57" y="141" fill="#d5fb8d" font-size="17" font-weight="bold">Session log</text><text x="57" y="165" fill="#a9bcb3" font-size="13">Select a local JSONL snapshot</text><text x="384" y="141" fill="#d5fb8d" font-size="17" font-weight="bold">Host mapping</text><text x="384" y="165" fill="#a9bcb3" font-size="13">Choose approved fields</text><text x="711" y="141" fill="#d5fb8d" font-size="17" font-weight="bold">Activity timeline</text><text x="711" y="165" fill="#a9bcb3" font-size="13">Replay minimized observations</text></g>
<path d="M314 150h44 M642 150h42" stroke="#64826e" stroke-width="2"/><circle r="5" fill="#c9acff"><animateMotion path="M314 150 H358" dur="2s" repeatCount="indefinite"/></circle><circle r="5" fill="#d5fb8d"><animateMotion path="M642 150 H684" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
</svg>
