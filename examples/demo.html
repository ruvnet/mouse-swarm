<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mouse swarm reveal</title><style>body{margin:0;background:#0a1010;color:#edf5e8;font:18px system-ui}main{max-width:850px;margin:12vh auto;padding:24px}small{color:#c5f777}h1{font-size:clamp(42px,8vw,76px)}p{line-height:1.6;color:#adbcac}button{padding:12px;background:#c5f777;border:0;border-radius:6px;margin:4px;cursor:pointer}.bar{position:fixed;bottom:10px;left:10px;background:#19281d;padding:8px;border-radius:8px;z-index:10}#progress{color:#c5f777;margin-left:8px;font-size:12px}</style></head><body><main><small data-swarm-item>SIMULATED SWARM REVEAL</small><h1 data-swarm-item data-swarm-type>Build something together.</h1><p data-swarm-item data-swarm-type>Agents can inspire a reveal that feels collaborative, one element at a time.</p></main><div class="bar" aria-label="Reveal controls"><button id="replay">Replay</button><button id="pause">Pause</button><button id="resume">Resume</button><button id="skip">Skip</button><span id="progress" aria-live="polite"></span></div><script type="module">import {createSwarmReveal} from './mouse-swarm.js';const out=document.querySelector('#progress');const r=createSwarmReveal({cursors:18,labels:['Scout','Builder','Reviewer'],botEvery:4,typeWords:2,onStep:({current,total})=>out.textContent=`${current} / ${total}`,onComplete:({reason})=>out.textContent=`Finished: ${reason}`});document.querySelector('#replay').onclick=r.replay;document.querySelector('#pause').onclick=r.pause;document.querySelector('#resume').onclick=r.resume;document.querySelector('#skip').onclick=r.skip;r.start();</script></body></html>
